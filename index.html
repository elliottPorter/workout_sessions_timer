<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Interval timer for workout sessions, perfect for jump rope, HIIT, and other timed exercises" />
		<title>Workout Interval Timer</title>
		<link rel="stylesheet" type="text/css" href="style.css" />
	</head>
	<body>
		<!-- Timer display modal -->
		<div id="modal_for_display" role="dialog" aria-labelledby="main_label" aria-hidden="true">
			<button id="close" aria-label="Close timer display">X</button>

			<div id="main_label" aria-live="polite"></div>
			<div id="main_timer" aria-live="polite" aria-atomic="true"></div>
			<div id="next_timer" aria-live="polite"></div>
			<div id="total_time"></div>

			<div id="buttons_container">
				<button id="pause_timer" aria-label="Pause the timer">Pause</button>
				<button id="resume_timer" aria-label="Resume the timer">Resume</button>
				<button id="stop" aria-label="Stop and cancel the timer">Stop</button>
			</div>
		</div>

		<!-- Countdown start modal -->
		<div id="modal_start" role="status" aria-live="assertive" aria-atomic="true"></div>

		<main id="container">
			<!-- Output section showing interval list -->
			<section id="output" aria-label="Workout intervals list">
				<div id="interval_ui" role="list" aria-label="Current intervals">Waiting for your intervals</div>

				<button id="save" style="display: none;" aria-label="Save reordered intervals">Save intervals</button>
				<button id="start" style="display: none;" aria-label="Start workout intervals">Start intervals</button>
			</section>

			<!-- Input section for creating intervals -->
			<section id="input" aria-label="Add new interval">
				<form id="user_input">
					<div>
						<label for="rest_period">
							Rest period?
							<select id="rest_period" aria-describedby="rest_help">
								<option value="false" selected="selected">No</option>
								<option value="true">Yes</option>
							</select>
						</label>
						<span id="rest_help" class="sr-only">Select 'Yes' if this is a rest period</span>

						<label id="interval_label" for="interval_description">
							Interval label
							<input
								id="interval_description"
								type="text"
								placeholder="e.g., Jump rope"
								aria-required="false"
							/>
						</label>
					</div>
					<div>
						<label for="minutes">
							Minutes
							<select id="minutes" name="minutes" aria-label="Select minutes for interval duration">
								<option value="0" selected="selected">0</option>
								<option value="1">1</option>
								<option value="2">2</option>
								<option value="3">3</option>
								<option value="4">4</option>
								<option value="5">5</option>
								<option value="6">6</option>
								<option value="7">7</option>
								<option value="8">8</option>
								<option value="9">9</option>
								<option value="10">10</option>
							</select>
						</label>
						<label for="seconds">
							Seconds
							<select id="seconds" name="seconds" aria-label="Select seconds for interval duration">
								<option value="0" selected>0</option>
								<option value="1">1</option>
								<option value="2">2</option>
								<option value="3">3</option>
								<option value="4">4</option>
								<option value="5">5</option>
								<option value="6">6</option>
								<option value="7">7</option>
								<option value="8">8</option>
								<option value="9">9</option>
								<option value="10">10</option>
								<option value="11">11</option>
								<option value="12">12</option>
								<option value="13">13</option>
								<option value="14">14</option>
								<option value="15">15</option>
								<option value="16">16</option>
								<option value="17">17</option>
								<option value="18">18</option>
								<option value="19">19</option>
								<option value="20">20</option>
								<option value="21">21</option>
								<option value="22">22</option>
								<option value="23">23</option>
								<option value="24">24</option>
								<option value="25">25</option>
								<option value="26">26</option>
								<option value="27">27</option>
								<option value="28">28</option>
								<option value="29">29</option>
								<option value="30">30</option>
								<option value="31">31</option>
								<option value="32">32</option>
								<option value="33">33</option>
								<option value="34">34</option>
								<option value="35">35</option>
								<option value="36">36</option>
								<option value="37">37</option>
								<option value="38">38</option>
								<option value="39">39</option>
								<option value="40">40</option>
								<option value="41">41</option>
								<option value="42">42</option>
								<option value="43">43</option>
								<option value="44">44</option>
								<option value="45">45</option>
								<option value="46">46</option>
								<option value="47">47</option>
								<option value="48">48</option>
								<option value="49">49</option>
								<option value="50">50</option>
								<option value="51">51</option>
								<option value="52">52</option>
								<option value="53">53</option>
								<option value="54">54</option>
								<option value="55">55</option>
								<option value="56">56</option>
								<option value="57">57</option>
								<option value="58">58</option>
								<option value="59">59</option>
							</select>
						</label>
					</div>
					<input type="submit" id="user_submit" value="Add interval" aria-label="Add this interval to the list" />
					<input type="button" id="reset_intervals" value="Reset intervals" aria-label="Clear all intervals" />
				</form>

				<audio id="beep" src="./sounds/beep.mp3" aria-hidden="true"></audio>
				<audio id="low_beep" src="./sounds/Robot_blip-Marianne_Gagnon-120342607.mp3" aria-hidden="true"></audio>
			</div>
		</main>
		<script src="app.js"></script>
	</body>
</html>
